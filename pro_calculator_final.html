<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>⚡Pro Calculator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101522;color:#f5f7fb;font-family:system-ui,Arial,sans-serif}
.app{height:100dvh;width:100%;max-width:520px;margin:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}
header{height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:space-between;font-weight:750;font-size:14px}
header button{background:#26334b;color:#fff;border:0;border-radius:9px;padding:6px 10px}
.display{flex:0 0 88px;min-height:88px;background:#192235;border:1px solid #2b3a52;border-radius:15px;padding:8px 13px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#expr{height:24px;text-align:right;color:#aab7ca;font-size:16px;white-space:nowrap;overflow:hidden}
#answer{font-size:clamp(34px,9vw,49px);line-height:1.05;font-weight:850;text-align:right;color:#54b5ff;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:6px}
.key{border:0;border-radius:12px;background:#26334b;color:#f5f7fb;font-size:clamp(15px,4.3vw,21px);font-weight:650;min-width:0;min-height:0;touch-action:manipulation}
.key:active{filter:brightness(1.35);transform:scale(.97)}
.op{background:#204364;color:#8fd0ff}.fn{background:#344052;color:#e3eaf4}.equal{background:#39a6ff;color:#061a2b;font-size:25px}.wide{grid-column:span 2}
.overlay{display:none;position:absolute;inset:0;background:#0d1422f7;padding:16px;z-index:4;flex-direction:column;gap:10px}.overlay.open{display:flex}
.histhead{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:750}.histhead button,.clear{border:0;border-radius:9px;background:#344052;color:white;padding:9px 12px}
#historyList{overflow:auto;display:flex;flex-direction:column;gap:7px}.item{background:#192235;padding:10px;border-radius:10px;text-align:right;color:#aab7ca}.item b{display:block;color:white;font-size:19px}
@media(max-height:650px){.app{gap:5px;padding-top:5px}.display{flex-basis:70px;min-height:70px;padding:5px 10px}#expr{height:19px;font-size:14px}#answer{font-size:clamp(29px,8vw,40px)}.keys{gap:4px}.key{border-radius:9px;font-size:clamp(13px,3.8vw,18px)}}

/* Keep every key; centre the number pad and align operators on the right */
.keys{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}
.keys [data-v="sqrt("]{grid-column:1;grid-row:3}
.keys [data-v="7"]{grid-column:2;grid-row:3}
.keys [data-v="8"]{grid-column:3;grid-row:3}
.keys [data-v="9"]{grid-column:4;grid-row:3}
.keys [data-v="/"]{grid-column:5;grid-row:3}
.keys [data-v="^2"]{grid-column:1;grid-row:4}
.keys [data-v="4"]{grid-column:2;grid-row:4}
.keys [data-v="5"]{grid-column:3;grid-row:4}
.keys [data-v="6"]{grid-column:4;grid-row:4}
.keys [data-v="*"]{grid-column:5;grid-row:4}
.keys [data-v="^"]{grid-column:1;grid-row:5}
.keys [data-v="1"]{grid-column:2;grid-row:5}
.keys [data-v="2"]{grid-column:3;grid-row:5}
.keys [data-v="3"]{grid-column:4;grid-row:5}
.keys [data-v="-"]{grid-column:5;grid-row:5}
.keys [data-v="0"]{grid-column:2 / span 2;grid-row:6}
.keys [data-v="."]{grid-column:4;grid-row:6}
.keys [data-v="+"]{grid-column:5;grid-row:6}
.keys [data-v="pi"]{grid-column:1;grid-row:6}
.keys [data-v="e"]{grid-column:1;grid-row:7}
.keys [data-v="!"]{grid-column:2;grid-row:7}
.keys [data-v="ANS"]{grid-column:3;grid-row:7}
.keys [data-v="M+"]{grid-column:4;grid-row:7}
.keys [data-v="="]{grid-column:5;grid-row:7}
.keys [data-v="M-"]{grid-column:1;grid-row:8}
.keys [data-v="MR"]{grid-column:2;grid-row:8}
.keys [data-v="MC"]{grid-column:3;grid-row:8}
.keys [data-v="ANGLE"]{grid-column:4;grid-row:8}
.keys [data-v="HIST"]{grid-column:5;grid-row:8}


/* Requested final swaps: √ with +, then x² with = */
.keys [data-v="sqrt("]{grid-column:5;grid-row:6}
.keys [data-v="+"]{grid-column:1;grid-row:3}
.keys [data-v="^2"]{grid-column:5;grid-row:7}
.keys [data-v="="]{grid-column:1;grid-row:4}
/* Compact, clearly labelled DEG/RAD toggle stays inside its key */
.keys [data-v="ANGLE"]{font-size:clamp(11px,3vw,15px);white-space:nowrap;padding:2px}

</style>
</head>
<body>
<div class="app">
<header><span>⚡Pro Calculator</span><button id="historyBtn">History</button></header>
<section class="display"><div id="expr"></div><div id="answer">0</div></section>
<div class="keys" id="keys">
<button class="key fn" data-v="sin(">sin</button><button class="key fn" data-v="cos(">cos</button><button class="key fn" data-v="tan(">tan</button><button class="key fn" data-v="log(">log</button><button class="key fn" data-v="ln(">ln</button>
<button class="key fn" data-v="("> ( </button><button class="key fn" data-v=")"> ) </button><button class="key fn" data-v="%">%</button><button class="key fn" data-v="DEL">DEL</button><button class="key fn" data-v="AC">AC</button>
<button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button><button class="key op" data-v="/">÷</button><button class="key fn" data-v="sqrt(">√</button>
<button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key op" data-v="*">×</button><button class="key fn" data-v="^2">x²</button>
<button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key op" data-v="-">−</button><button class="key fn" data-v="^">xʸ</button>
<button class="key wide" data-v="0">0</button><button class="key" data-v=".">.</button><button class="key equal" data-v="=">=</button><button class="key op" data-v="+">+</button>
<button class="key fn" data-v="pi">π</button><button class="key fn" data-v="e">e</button><button class="key fn" data-v="!">n!</button><button class="key fn" data-v="ANS">ANS</button><button class="key fn" data-v="M+">M+</button>
<button class="key fn" data-v="M-">M−</button><button class="key fn" data-v="MR">MR</button><button class="key fn" data-v="MC">MC</button><button class="key fn" data-v="ANGLE" id="angleMode">DEG</button><button class="key fn" data-v="HIST">History</button>
</div></div>
<div class="overlay" id="overlay"><div class="histhead">Calculation history <button id="closeHistory">Close ✕</button></div><div id="historyList"></div><button class="clear" id="clearHistory">Clear history</button></div>
<script>
const $=id=>document.getElementById(id), exprEl=$('expr'), answerEl=$('answer');
let expr='',lastAnswer=0,memory=0,deg=true,history=[];
function display(){exprEl.textContent=expr;let v=calc(false);if(expr==='')answerEl.textContent='0';else if(v!==null)answerEl.textContent=fmt(v)}
function fmt(v){return Number(v.toPrecision(11)).toString()}
function factorial(n){if(n<0||n>170||!Number.isInteger(n))throw Error();let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function calc(showError=true){
 if(!expr.trim())return 0;
 try{
  let s=expr.replace(/π/g,'Math.PI').replace(/\bpi\b/g,'Math.PI').replace(/\be\b/g,'Math.E')
   .replace(/sqrt\(/g,'Math.sqrt(').replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(')
   .replace(/\^2/g,'**2').replace(/\^/g,'**').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  if(deg)s=s.replace(/Math\.(sin|cos|tan)\(([^()]*)\)/g,(m,f,a)=>`Math.${f}((${a})*Math.PI/180)`);
  s=s.replace(/(\d+(?:\.\d+)?)!/g,(m,n)=>factorial(Number(n)));
  if(!/^[0-9+\-*/().,\sA-Za-z]*$/.test(s))throw Error();
  const v=Function('"use strict";return ('+s+')')();
  if(typeof v!=='number'||!Number.isFinite(v))throw Error();
  return v;
 }catch(e){if(showError)answerEl.textContent='Error';return null}
}
function add(v){
 if(v==='AC'){expr='';display();return}
 if(v==='DEL'){expr=expr.slice(0,-1);display();return}
 if(v==='ANGLE'){deg=!deg;$('angleMode').textContent=deg?'DEG':'RAD';display();return}
 if(v==='HIST'){openHistory();return}
 if(v==='M+'){let n=calc();if(n!==null)memory+=n;return}
 if(v==='M-'){let n=calc();if(n!==null)memory-=n;return}
 if(v==='MR'){expr+=fmt(memory);display();return}
 if(v==='MC'){memory=0;return}
 if(v==='ANS'){expr+=fmt(lastAnswer);display();return}
 if(v==='='){let n=calc();if(n===null){answerEl.textContent='Error';return}lastAnswer=n;history.unshift({e:expr,r:fmt(n)});history=history.slice(0,60);exprEl.textContent=expr+' =';expr=fmt(n);answerEl.textContent=fmt(n);return}
 if(v==='pi')v='π'; if(v==='^2')v='^2';
 expr+=v;display();
}
$('keys').addEventListener('click',e=>{let b=e.target.closest('button');if(b)add(b.dataset.v)});
function openHistory(){$('overlay').classList.add('open');renderHistory()}
function renderHistory(){$('historyList').innerHTML=history.length?history.map(h=>`<div class="item">${h.e}<b>${h.r}</b></div>`).join(''):'<div class="item">No calculations yet</div>'}
$('historyBtn').onclick=openHistory;$('closeHistory').onclick=()=>$('overlay').classList.remove('open');$('clearHistory').onclick=()=>{history=[];renderHistory()};
document.addEventListener('keydown',e=>{if(/^[0-9.+\-*/()%()]$/.test(e.key))add(e.key);else if(e.key==='Enter')add('=');else if(e.key==='Backspace')add('DEL');else if(e.key==='Escape')add('AC')});
</script>
</body></html>
